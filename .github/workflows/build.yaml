name: "Build NixOS config and push to cache"

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub runners only have ~14 GB free; the system closure needs more.
      # This reclaims ~65 GB by removing the runner's preinstalled toolchains.
      - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v15
        with:
          name: quoteme-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cachix-action pushes every path built in this job when it finishes
      - run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --print-build-logs
